name: Sync Omie

# Gatilho único: o cron da Vercel (web/vercel.json, 06:00 UTC = 03:00 BRT)
# dispara este workflow. O `schedule` do GitHub foi removido porque atrasa
# horas e gerava uma segunda carga completa no mesmo dia.
on:
  workflow_dispatch:
    inputs:
      app_key:
        description: "App Key Omie (vazio = todas as empresas ativas)"
        required: false
        default: ""

# Nunca duas cargas ao mesmo tempo; um disparo novo espera o atual terminar.
concurrency:
  group: sync-omie
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Carga Omie
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
          TZ: America/Sao_Paulo
          APP_KEY_INPUT: ${{ github.event.inputs.app_key }}
        run: |
          if [ -n "$APP_KEY_INPUT" ]; then
            node scripts/load-full.js "$APP_KEY_INPUT"
          else
            npm run load:all
          fi
